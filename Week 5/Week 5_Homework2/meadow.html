<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Meadow</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #eaf2e7;
    }

    canvas {
      display: block;
    }

    .back {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 10;
      padding: 10px 16px;
      border: 1px solid #71856a;
      border-radius: 24px;
      background: #faf5ec;
      color: #40523c;
      font: 14px Georgia, serif;
      text-decoration: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/p5@2/lib/p5.min.js"></script>
</head>

<body>
<a class="back" href="homework2.html">← Back to the cat</a>

<script>

let xLoc = [];
let yLoc = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  textAlign(CENTER);
  textFont("Georgia");
}

function draw() {
  background(229, 239, 233);

  //sun
  noStroke();
  fill(250, 226, 171);
  circle(width * 0.78, height * 0.2, 95);

  // hills
  fill(179, 201, 169);
  ellipse(width * 0.2, height * 0.8,
          width * 1.3, height * 0.7);

  fill(145, 177, 137);
  ellipse(width * 0.85, height * 0.88,
          width * 1.4, height * 0.8);

  // grassField
  fill(119, 157, 114);
  rect(0, height * 0.7, width, height * 0.3);

  // grass
  stroke(85, 128, 83);
  strokeWeight(2);

  for (let i = 0; i < width / 18; i++) {
    let x = i * 18;
    let sway = sin(frameCount * 0.025 + i) * 5;

    line(x, height, x + sway, height - 25);
    line(x, height, x - 7 + sway, height - 16);
  }

  
  for (let i = 0; i < xLoc.length; i++) {
    drawFlower(xLoc[i], yLoc[i], i);
  }

  // words
  noStroke();
  fill(61, 83, 63);
  textSize(32);
  text("Stay a little longer.", width / 2, height * 0.18);

  textSize(15);
  text("Click the grass to plant flowers. Press C to clear.",
       width / 2, height * 0.18 + 35);

  textSize(13);
  text("Flowers planted: " + xLoc.length,
       width / 2, height * 0.18 + 62);
}


function drawFlower(x, y, i) {
  let sway = sin(frameCount * 0.025 + i) * 4;

  
  stroke(60, 111, 65);
  strokeWeight(2);
  line(x, y, x + sway, y - 35);

  
  noStroke();

  if (i % 2 === 0) {
    fill(247, 213, 215);
  } else {
    fill(245, 234, 190);
  }

  for (let n = 0; n < 5; n++) {
    let angle = n * TWO_PI / 5;

    circle(
      x + sway + cos(angle) * 8,
      y - 35 + sin(angle) * 8,
      12
    );
  }

  
  fill(218, 163, 72);
  circle(x + sway, y - 35, 8);
}

function mousePressed() {
  
  if (
    mouseX >= 0 &&
    mouseX <= width &&
    mouseY > height * 0.7 &&
    mouseY < height - 20
  ) {
    xLoc.push(mouseX);
    yLoc.push(mouseY);
  }
}

function keyPressed() {
  if (key === "c" || key === "C") {
    xLoc = [];
    yLoc = [];
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>
